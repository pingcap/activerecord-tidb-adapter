name: CI

on:
  push:
    branches:
      - main
      - 7-0-stable
    paths-ignore:
      - 'README*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - 7-0-stable
    paths-ignore:
      - 'README*.md'
      - 'docs/**'

jobs:
  test:
    if: ${{ !contains(github.event.commits[0].message, '[skip ci]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tidb-version:
          # Latest patch of each series still in maintenance or extended
          # support: https://www.pingcap.com/tidb-release-support-policy/
          - v6.5.12
          - v7.1.6
          - v7.5.8
          - v8.1.2
          - v8.5.8
    name: tidb ${{ matrix.tidb-version }}
    env:
      MYSQL_USER: root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 4000
      tidb: 1
      ARCONN: tidb
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2
        bundler-cache: true
    - name: Start TiDB with tiup playground
      # Run real PD/TiKV/TiDB via the official tiup playground. A standalone
      # pingcap/tidb image uses unistore, whose lock handling differs from
      # TiKV and makes the deadlock / lock wait / concurrency tests fail.
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
        echo "$HOME/.tiup/bin" >> "$GITHUB_PATH"
        nohup "$HOME/.tiup/bin/tiup" playground ${{ matrix.tidb-version }} \
          --tag ci --tiflash 0 --without-monitor \
          --db.config "$GITHUB_WORKSPACE/config.toml" > "$RUNNER_TEMP/playground.log" 2>&1 &
    - name: Wait for TiDB
      run: |
        for i in $(seq 1 90); do
          mysql --host 127.0.0.1 --port 4000 -u root -e 'select tidb_version()' && exit 0
          sleep 5
        done
        cat "$RUNNER_TEMP/playground.log"
        exit 1
    - run: bundle exec rake db:tidb:build
    - run: bundle exec rake test:tidb
