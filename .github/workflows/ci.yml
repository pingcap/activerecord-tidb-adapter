name: CI

on:
  push:
    branches:
      - main
      - 7-0-stable
    paths-ignore:
      - 'README*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - 7-0-stable
    paths-ignore:
      - 'README*.md'
      - 'docs/**'

jobs:
  test:
    if: ${{ !contains(github.event.commits[0].message, '[skip ci]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tidb-version:
          - v5.1.1
    name: tidb ${{ matrix.tidb-version }}
    services:
      tidb:
        # tiup playground with real PD/TiKV; the binaries are downloaded at
        # container start, so wait for the port below instead of sleeping.
        image: hooopo/tidb-playground:${{ matrix.tidb-version }}
        env:
          TIDB_VERSION: ${{ matrix.tidb-version }}
        ports: ["4000:4000"]
    env:
      MYSQL_USER: root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 4000
      tidb: 1
      ARCONN: tidb
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 2.7
        bundler-cache: true
    - name: Wait for TiDB
      run: |
        for i in $(seq 1 90); do
          mysql --host 127.0.0.1 --port 4000 -u root -e 'select tidb_version()' && exit 0
          sleep 5
        done
        docker logs "${{ job.services.tidb.id }}"
        exit 1
    - run: bundle exec rake db:tidb:build
    - name: Enable change column type (TiDB 5.0)
      if: ${{ matrix.tidb-version == 'v5.0.3' }}
      run: mysql --host 127.0.0.1 --port 4000 -u root -e 'set @@global.tidb_enable_change_column_type = 1'
    - name: Run one leaking test with SQL log (DIAGNOSTIC)
      env:
        DIAG_SQL: '1'
        TEST_FILES_AR: test/cases/associations/has_many_through_associations_test.rb
        TESTOPTS: '-v -n "/test_associate_with_create_and_(in)?valid_options/"'
      run: bundle exec rake test:tidb
    - name: Contracts after the run
      if: always()
      run: mysql --host 127.0.0.1 --port 4000 -u root activerecord_unittest -e 'select * from contracts; select id, name from developers order by id desc limit 3'
